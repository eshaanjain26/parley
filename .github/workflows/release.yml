name: Release

# Push a tag like v0.2.0 (after `npm run set-version -- 0.2.0` is merged) to build signed
# update bundles and DMGs for Apple silicon and Intel into a draft GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-14
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Tag matches app version
        run: npm run set-version -- "${GITHUB_REF_NAME#v}" --check

      # Without a Developer ID certificate in secrets the app is ad-hoc signed: users open it
      # through Privacy & Security > Open Anyway, and macOS asks for microphone and system-audio
      # access again after each update. Adding the APPLE_* secrets switches on Developer ID
      # signing and notarization. Tauri treats any APPLE_CERTIFICATE variable as a certificate
      # to import, even an empty one from a missing secret, so the Apple variables reach the
      # build only when the certificate is set.
      - name: Choose signing
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "config=" >> "$GITHUB_OUTPUT"
            echo "Signing with Developer ID and notarizing."
          else
            echo "config=--config src-tauri/tauri.adhoc.conf.json" >> "$GITHUB_OUTPUT"
            echo "::warning::No APPLE_CERTIFICATE secret: building ad-hoc signed, not notarized."
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Parley ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Download the DMG for your Mac (aarch64 for Apple silicon, x64 for Intel).
          releaseDraft: true
          args: --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.release.conf.json ${{ steps.signing.outputs.config }}

  # tauri-action points the update feed at api.github.com asset URLs (the release is still a
  # draft), which count against GitHub's unauthenticated API rate limit. Once both builds have
  # uploaded, rewrite them to releases/download URLs, which go live when the draft is published.
  feed:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite latest.json download URLs
        run: |
          mkdir feed
          gh release download "$TAG" --pattern latest.json --dir feed
          gh release view "$TAG" --json assets > feed/assets.json
          node scripts/feed-urls.mjs feed/latest.json feed/assets.json "$GITHUB_REPOSITORY" "$TAG"
          gh release upload "$TAG" feed/latest.json --clobber
